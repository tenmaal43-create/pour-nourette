<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffd9e6">
<title>Joyeux anniversaire Nourette</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="hud"><span id="sg">STAGE 0/4</span><button class="mini" id="snd" aria-pressed="true">SON : OUI</button></div>

  <noscript><p>Ce petit jeu a besoin de JavaScript pour fonctionner.</p></noscript>

  <section class="st on" id="s0">
    <canvas id="ct" aria-hidden="true"></canvas>
    <h1 id="ti"></h1>
    <p>1 JOUEUSE · 4 NIVEAUX<br>1 LETTRE À LA FIN</p>
    <button class="btn blink" id="start">PRESS START</button>
  </section>

  <section class="st" id="s1">
    <p>NIVEAU 1 · ATTRAPE 8 CŒURS</p>
    <canvas id="g1" width="300" height="220" aria-label="Attrape les cœurs avec le chat"></canvas>
    <p id="sc">♥ 0/8</p>
    <p class="tip">Bouge ton doigt, ta souris ou les flèches ← →</p>
  </section>

  <section class="st" id="s2">
    <p id="g2t"></p>
    <svg id="gs" viewBox="0 0 160 200" role="img" aria-label="Machine à capsules">
      <circle cx="80" cy="66" r="52" fill="#fff" fill-opacity=".6" stroke="#7a2d52" stroke-width="4"/>
      <circle cx="60" cy="80" r="14" fill="#ff8fb1"/><circle cx="92" cy="86" r="14" fill="#b79ced"/><circle cx="76" cy="52" r="14" fill="#8fe3c8"/><circle cx="104" cy="56" r="12" fill="#ffd96b"/><circle cx="50" cy="56" r="11" fill="#ff5d8f"/>
      <rect x="30" y="118" width="100" height="70" rx="8" fill="#ff5d8f" stroke="#7a2d52" stroke-width="4"/>
      <rect x="62" y="162" width="36" height="22" rx="4" fill="#7a2d52"/>
      <g id="hd" style="transform-origin:80px 140px;transition:transform .7s"><circle cx="80" cy="140" r="12" fill="#ffe9b8" stroke="#7a2d52" stroke-width="3"/><rect x="77" y="130" width="6" height="20" fill="#7a2d52"/></g>
      <g id="cap"><circle cx="80" cy="172" r="9" fill="#ffd96b" stroke="#7a2d52" stroke-width="2"/></g>
    </svg>
    <div id="gcard" class="gcard"></div>
    <p id="gm" class="capmsg" aria-live="polite">Tourne la manivelle !</p>
    <button class="btn" id="gb">TOURNER</button>
    <button class="btn" id="g2n" hidden>NIVEAU SUIVANT ▶</button>
  </section>

  <section class="st" id="s3">
    <p>NIVEAU 3 · MEMORY<br>RETROUVE LES PAIRES</p>
    <div class="mem" id="mem"></div>
    <p id="mm" aria-live="polite" class="mmsg">&nbsp;</p>
  </section>

  <section class="st" id="s4">
    <p id="lh">NIVEAU 4 · LA LETTRE</p>
    <article class="pap" id="pap">
      <p class="sal" id="sal"></p>
      <div id="lt"></div>
      <div class="sgn" id="sgn"></div>
    </article>
    <div class="row">
      <button class="btn" id="skip">TOUT AFFICHER</button>
      <button class="btn" id="again" hidden>REJOUER ↺</button>
    </div>
    <div class="album" id="album" hidden>
      <p>★ NOTRE ALBUM ★</p>
      <div class="agrid" id="ag"></div>
    </div>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/game.js"></script>
</body>
</html>
